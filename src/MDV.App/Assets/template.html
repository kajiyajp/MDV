<!DOCTYPE html>
<html class="{{THEME_CLASS}}">
<head>
  <meta charset="utf-8">
  <!-- 文書内のスクリプト・on属性・外部への通信・リモート画像を止める(「通信なし・データ収集なし」を守るため。#17)。
       実行できるのは同梱ライブラリ(http://vendor)と、nonce を付けたこのテンプレートのインラインスクリプトだけ。
       nonce は表示のたびに MarkdownRenderer.BuildHtml が乱数で埋めるので、文書側からは真似できない。
       本文より前に置く必要がある。文書が別の CSP を書いても、ポリシーは厳しくなる方向にしか働かない。
       (このコメントにプレースホルダ名を書かないこと。Replace がすべての出現箇所を置換するため) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src http://vendor 'nonce-{{NONCE}}'; style-src http://vendor 'unsafe-inline'; img-src http://vendor data:; font-src http://vendor data:; connect-src 'none'">
  <base href="{{BASE_HREF}}">
  <!-- テーマ別CSS: クラスで出し分け -->
  <link rel="stylesheet" href="http://vendor/github-markdown-light.css" id="md-light">
  <link rel="stylesheet" href="http://vendor/github-markdown-dark.css"  id="md-dark">
  <link rel="stylesheet" href="http://vendor/github.min.css"      id="hl-light">
  <link rel="stylesheet" href="http://vendor/github-dark.min.css" id="hl-dark">
  <link rel="stylesheet" href="http://vendor/katex.min.css">
  <style>
    body { margin: 0; }
    .markdown-body { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: 24px; }
    /* 文書の背景色(github-markdown-css の本文色)をページ全体に広げ、900px の本文列の外側も同じ色にする。
       ウィンドウ側も同じ色で塗る(MainWindow.ApplyWindowBackground)ため、ウィンドウと文書の境目が出ない。
       theme-system は prefers-color-scheme で判定する(ホストが WebView2 の配色をアプリのテーマに合わせている)。 */
    html.theme-light, html.theme-system { background-color: #ffffff; }
    html.theme-dark { background-color: #0d1117; }
    @media (prefers-color-scheme: dark) { html.theme-system { background-color: #0d1117; } }
    /* コードブロック右上の「コピー」ボタン（ホバーで表示） */
    .markdown-body pre { position: relative; }
    .md-copy-btn {
      position: absolute; top: 6px; right: 6px;
      padding: 3px 8px; font-size: 12px; line-height: 1.4;
      font-family: system-ui, "Segoe UI", sans-serif;
      border: 1px solid rgba(128,128,128,.4); border-radius: 6px;
      background: rgba(128,128,128,.15); color: inherit; cursor: pointer;
      opacity: 0; transition: opacity .15s;
    }
    .markdown-body pre:hover .md-copy-btn { opacity: 1; }
    .md-copy-btn:hover { background: rgba(128,128,128,.3); }
    /* 印刷時: github-markdown-css の本文色(#1F2328/#e6edf3)はテーマ用の準黒/準白のため、
       プリンタの白黒(グレースケール)変換では薄いグレーになってしまう。
       印刷時のみ純黒(#000)に強制して読みやすくする。 */
    @media print {
      body { background: #fff !important; }
      .markdown-body { color: #000 !important; }
      .md-copy-btn { display: none !important; }
    }
  </style>
</head>
<body>
  <article class="markdown-body">{{BODY}}</article>
  <script src="http://vendor/highlight.min.js"></script>
  <script src="http://vendor/katex.min.js"></script>
  <script src="http://vendor/auto-render.min.js"></script>
  <script src="http://vendor/mermaid.min.js"></script>
  <script nonce="{{NONCE}}">
    // テーマ別CSSの有効/無効を切替（disabled属性をJSで制御）
    function applyTheme() {
      var dark = document.documentElement.classList.contains('theme-dark') ||
        (document.documentElement.classList.contains('theme-system') &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.getElementById('md-dark').disabled = !dark;
      document.getElementById('hl-dark').disabled = !dark;
      document.getElementById('md-light').disabled = dark;
      document.getElementById('hl-light').disabled = dark;
    }
    applyTheme();
    // 「システムに合わせる」のとき、表示中にOSのテーマが変わっても本文の配色を追従させる
    // (ウィンドウ側の背景は MainWindow が ActualThemeChanged で追従する)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (document.documentElement.classList.contains('theme-system')) applyTheme();
    });
    // コード色付け
    // ※各ベンダーライブラリの利用は存在確認+try/catchで囲み、
    //   1つの失敗が後続の処理(ショートカット・コピーボタン等)を道連れにしないようにする
    try {
      if (typeof hljs !== 'undefined') {
        document.querySelectorAll('pre code').forEach(function (el) { hljs.highlightElement(el); });
      } else { console.error('hljs is not loaded'); }
    } catch (e) { console.error('highlight error:', e); }
    // 数式
    // Markdig(UseMathematics)は $...$ / $$...$$ を解釈し、HTML上は \(...\) / \[...\] 形式の
    // <span class="math">/<div class="math"> として出力する（$ はHTMLに残らない）。
    // そのためKaTeXの自動描画にも \( \) / \[ \] の区切りを登録する必要がある。
    try {
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$',  right: '$',  display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ]
        });
      } else { console.error('KaTeX auto-render is not loaded'); }
    } catch (e) { console.error('math render error:', e); }
    // Mermaid図
    // ダークモード時はMermaidもダークテーマで描画。
    // 初回は同期的に mermaid.run() を呼び（従来どおりの確実な描画）、万一SVGが
    // 生成されなかった図だけを setTimeout で最大3回まで再描画する。
    // (Store認定テストで「図が生成されない」事象が非決定的に発生したための堅牢化。
    //  requestAnimationFrame は非描画コンテキストで発火しない場合があるため使わず、
    //  確実に発火する setTimeout を用いる)
    (function () {
      if (typeof mermaid === 'undefined') { console.error('mermaid is not loaded'); return; }
      var __mermaidDark = document.documentElement.classList.contains('theme-dark') ||
        (document.documentElement.classList.contains('theme-system') &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      mermaid.initialize({ startOnLoad: false, theme: __mermaidDark ? 'dark' : 'default' });
      // 再試行に備えて各図の元ソースを保持（描画失敗時に data-processed と内容を復元する）
      var sources = [];
      document.querySelectorAll('.mermaid').forEach(function (el) {
        sources.push({ el: el, src: el.textContent });
      });
      if (sources.length === 0) return;
      function unrendered() {
        return sources.filter(function (s) {
          var svg = s.el.querySelector('svg');
          if (!svg) return true;                                   // 図が生成されていない
          // Mermaidのエラーグラフィック(構文エラー時のbomb図)なら未描画扱いにして再試行する
          if (svg.querySelector('.error-icon, .error-text')) return true;
          return false;
        });
      }
      function render(attempt) {
        var targets = unrendered();
        if (targets.length === 0) return;
        if (attempt > 0) {
          targets.forEach(function (s) {
            s.el.removeAttribute('data-processed');
            s.el.textContent = s.src;
          });
        }
        var p;
        try {
          p = mermaid.run({ nodes: targets.map(function (s) { return s.el; }) });
        } catch (e) {
          console.error('mermaid render error:', e);
        }
        Promise.resolve(p)
          .catch(function (e) { console.error('mermaid render error:', e); })
          .then(function () {
            if (unrendered().length > 0 && attempt < 3) {
              setTimeout(function () { render(attempt + 1); }, 300);
            }
          });
      }
      render(0);   // 初回は同期実行。失敗した図のみ上の setTimeout で再試行する。
    })();
    // ホスト(C#)からテーマ変更を受けるためのフック
    window.__setTheme = function (cls) {
      document.documentElement.className = cls;
      applyTheme();
    };
    // ホスト(C#)から文字サイズ(ズーム)変更を受けるためのフック
    // WinUI3のWebView2コントロールはCoreWebView2Controller.ZoomFactorを公開していないため、
    // CSSのzoomプロパティで代替する（ナビゲーションのたびに再適用が必要）
    window.__setZoom = function (factor) {
      document.body.style.zoom = factor;
    };
    // WebView2にフォーカスがある間もアプリのメニューショートカットを効かせるため、
    // 該当キーを捕捉してホスト(C#)へ通知する（ホスト側で対応するメニュー動作を実行）。
    document.addEventListener('keydown', function (ev) {
      var ctrl = ev.ctrlKey && !ev.altKey && !ev.metaKey;
      var msg = null;
      if (ctrl && (ev.key === 'o' || ev.key === 'O')) msg = 'open';
      else if (ctrl && (ev.key === 'p' || ev.key === 'P')) msg = 'print';
      else if (ctrl && (ev.key === '+' || ev.key === '=')) msg = 'zoomIn';
      else if (ctrl && (ev.key === '-' || ev.key === '_')) msg = 'zoomOut';
      else if (ctrl && ev.key === '0') msg = 'zoomReset';
      else if (ev.key === 'F5') msg = 'reload';
      else if (ev.key === 'F1') msg = 'about';
      if (msg && window.chrome && window.chrome.webview) {
        ev.preventDefault();
        window.chrome.webview.postMessage(msg);
      }
    });
    // コードブロック右上に「コピー」ボタンを追加する（Mermaid図は除外）。
    // クリップボードは確実性のためホスト(C#)経由でコピーする（postMessage 'copy:'）。
    // ボタンの文言はホスト(C#)が表示言語の文字列(JS文字列リテラル)に置換する。
    var __copyLabel = {{COPY_LABEL}}, __copiedLabel = {{COPIED_LABEL}};
    document.querySelectorAll('.markdown-body pre').forEach(function (pre) {
      if (pre.classList.contains('mermaid')) return;
      var code = pre.querySelector('code');
      if (!code) return;
      var btn = document.createElement('button');
      btn.className = 'md-copy-btn';
      btn.type = 'button';
      btn.textContent = __copyLabel;
      btn.addEventListener('click', function () {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage('copy:' + code.innerText);
          btn.textContent = __copiedLabel;
          setTimeout(function () { btn.textContent = __copyLabel; }, 1200);
        }
      });
      pre.appendChild(btn);
    });
  </script>
</body>
</html>
